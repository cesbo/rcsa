[package]
name = "rcsa"
version = "0.2.1"
description = "DVB Common Scrambling Algorithm (CSA) descrambler and scrambler for MPEG-TS"
authors = ["Cesbo Developers Team <info@cesbo.com>"]
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/rcsa"
repository = "https://github.com/cesbo/libcsa"
keywords = ["dvb", "csa", "descrambler", "mpeg-ts", "conditional-access"]
categories = ["cryptography", "multimedia::video"]
edition = "2024"

[dependencies]

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "decrypt"
harness = false

# The batch-size sweeps take minutes unoptimized; debug assertions and overflow checks stay on.
[profile.test]
opt-level = 2
